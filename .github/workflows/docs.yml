name: docs and bindings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -b html -W --keep-going -n . _build/html
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: _build/html

  bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: rustup target add thumbv7em-none-eabihf
      - run: make -C research/yt9215-registers check

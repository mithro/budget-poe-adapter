name: docs and bindings

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r docs/requirements.txt
      - run: npm ci --prefix research/yt9215-registers/tools/wavedrom
      - run: python -m sphinx -b html -W --keep-going -n . _build/html
      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: _build/html

  bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt systemrdl-compiler==1.33.0
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: rustup target add thumbv7em-none-eabihf
      - run: make -C research/yt9215-registers check

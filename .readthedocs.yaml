# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
    nodejs: "22"
  jobs:
    post_install:
      # WaveDrom draws the register and timing diagrams of the YT921x manual.
      - npm ci --prefix research/yt9215-registers/tools/wavedrom

sphinx:
  configuration: conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

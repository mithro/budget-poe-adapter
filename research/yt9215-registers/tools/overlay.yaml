# Hand-written part of the YT921x register description.
#
# tools/extract.py reads addresses, bit positions and enumerated values from
# the Linux driver and the vendor SDK. Everything below is what those sources
# do not carry: block assignment, titles, descriptions, access types, index
# ranges and reset values. Descriptions may use the documentation roles
# :reg:`NAME`, :field:`REG.FIELD` and :ref:`text <label>`; they are turned into
# plain text for the SVD, SystemRDL and binding files.

device:
  name: YT921x
  vendor: Motorcomm
  title: Motorcomm YT921x Gigabit Ethernet switch family
  address_bits: 32
  data_bits: 32
  ports: 11

# One row per part the identification sequence can tell apart.
#   major    CHIP_ID.MAJOR
#   mode     CHIP_MODE.MODE
#   extmode  configuration byte 0xfb (see EDATA_CTRL)
#   phy / xmii / serdes  port numbers that have that kind of interface
chips:
  - {name: YT9215SC, family: yt9215, major: 0x9002, mode: 1, extmode: 0, phy: [0, 1, 2, 3, 4], xmii: [9], serdes: [8, 9]}
  - {name: YT9215S, family: yt9215, major: 0x9002, mode: 2, extmode: 0, phy: [0, 1, 2, 3, 4], xmii: [9], serdes: [8]}
  - {name: YT9215RB, family: yt9215, major: 0x9002, mode: 3, extmode: 0, phy: [0, 1, 2, 3, 4], xmii: [8, 9], serdes: []}
  - {name: YT9214NB, family: yt9215, major: 0x9002, mode: 3, extmode: 2, phy: [1, 3], xmii: [9], serdes: [8]}
  - {name: YT9213NB, family: yt9215, major: 0x9002, mode: 3, extmode: 3, phy: [1, 3], xmii: [9], serdes: [9]}
  - {name: YT9218N, family: yt9218, major: 0x9001, mode: 0, extmode: 0, phy: [0, 1, 2, 3, 4, 5, 6, 7], xmii: [], serdes: []}
  - {name: YT9218MB, family: yt9218, major: 0x9001, mode: 1, extmode: 0, phy: [0, 1, 2, 3, 4, 5, 6, 7], xmii: [8, 9], serdes: [8, 9]}

blocks:
  - id: system
    title: Global control
    guide: bringup
    summary: Reset, feature enables, part identification, pin strap overrides, I/O voltage, the temperature sensor and the configuration byte store.
  - id: cpu
    title: CPU port and frame tagging
    guide: cpu-tag
    summary: Which port leads to the host CPU, whether frames on it carry the 8-byte CPU tag, and where trapped frames are sent.
  - id: port
    title: Port MAC and external interfaces
    guide: ports
    summary: Per-port speed, duplex, flow control and MAC enables, frame size, and the SGMII and xMII interfaces of ports 8 and 9.
  - id: mbus
    title: MDIO master buses
    guide: phy
    summary: Two MDIO masters inside the switch, one for the built-in PHYs and SerDes PCS and one for PHYs on the external MDIO pins.
  - id: eee
    title: Energy Efficient Ethernet
    guide: ports
    summary: Per-port Energy Efficient Ethernet (EEE) enables.
  - id: mib
    title: Port counters
    guide: mib
    summary: Per-port packet and byte counters (MIB) and their control register.
  - id: led
    title: LEDs
    guide: leds
    summary: What each port LED shows, forced LED states, blink timing, and the serial and parallel LED output mapping.
  - id: vlan
    title: VLAN
    guide: vlan
    summary: The 4096-entry VLAN table, port default VLANs, tag protocol identifiers, and ingress and egress VLAN filtering.
  - id: qos
    title: Priority mapping
    guide: qos
    summary: Mapping of DSCP and VLAN priority to the internal priority and colour, and per-port priority sources.
  - id: l2
    title: Port forwarding control
    guide: forwarding
    summary: Which ports may forward to which, per-port spanning tree state, address learning control and the ageing timer.
  - id: fdb
    title: Forwarding database
    guide: fdb
    summary: The command interface to the 4096-entry MAC address table.
  - id: flood
    title: Flooding and unknown destinations
    guide: forwarding
    summary: Where broadcast, multicast and unknown-destination frames may be flooded, and what happens to frames with an unknown destination.
  - id: lag
    title: Link aggregation
    guide: lag
    summary: Two link aggregation groups of up to four ports and the hash that spreads traffic over them.
  - id: acl
    title: Access control list
    guide: acl
    summary: The 384-entry match and action table, its 48 blocks of eight key slots, and the user-defined field windows.
  - id: meter
    title: Meters and ingress rate limiting
    guide: rate
    summary: Token bucket meters used for per-port ingress rate limiting and by ACL rules.
  - id: shape
    title: Egress shaping
    guide: rate
    summary: Per-port egress token bucket shapers.
  - id: mirror
    title: Port mirroring
    guide: mirror
    summary: Copying frames received or sent on chosen ports to one monitor port.

# Address regions. A register belongs to the region with the highest base that
# is not above its address. Names follow the vendor SDK module names where the
# SDK has one.
regions:
  - {name: EXT_MBUS, base: 0x6a000, title: External MDIO master}
  - {name: GLOBAL, base: 0x80000, title: Global control and port MACs}
  - {name: EEE_MAC, base: 0xa0000, title: Per-port EEE}
  - {name: EEE, base: 0xb0000, title: EEE control}
  - {name: MIB, base: 0xc0000, title: Port counters}
  - {name: LED, base: 0xd0000, title: LED control}
  - {name: EDATA, base: 0xe0000, title: Configuration byte store and clock}
  - {name: INT_MBUS, base: 0xf0000, title: Internal MDIO master}
  - {name: EGRESS, base: 0x100000, title: Egress tag processing}
  - {name: L2, base: 0x180000, title: Layer 2 forwarding and VLAN table}
  - {name: ACL_ACTION, base: 0x1c0000, title: ACL action table}
  - {name: ACL, base: 0x200000, title: ACL keys and control}
  - {name: PARSER, base: 0x210000, title: Ingress parser}
  - {name: METER, base: 0x220000, title: Ingress meters}
  - {name: PORT_VLAN, base: 0x230000, title: Ingress port VLAN}
  - {name: QUEUE, base: 0x300000, title: Queue manager}
  - {name: SCHED, base: 0x340000, title: Egress scheduler}


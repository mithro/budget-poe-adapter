  LED1_PORT: {from: LED2_PORT, only: [ACT, ACT_EEE_BLINK, ACT_LOOPDETECT_BLINK, ACT_ACTIVE_BLINK, ACT_DUPLEX_FULL, ACT_DUPLEX_HALF, ACT_TX_BLINK, ACT_RX_BLINK, ACT_TX, ACT_RX, ACT_1000M, ACT_100M, ACT_10M, ACT_COLLISION_BLINK, ACT_1000M_BLINK, ACT_100M_BLINK, ACT_10M_BLINK]}

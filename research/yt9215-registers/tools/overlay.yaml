enums:
  speed:
    title: Link speed codes
    desc: Speed code used by every SPEED field.
    values: {'10': 10 Mbit/s, '100': 100 Mbit/s, '1000': 1000 Mbit/s, '10000': 10000 Mbit/s, '2500': 2500 Mbit/s}
  app_selector:
    title: Priority sources
    desc: Index of a priority source in :reg:`PORT_PRIO_ORD`.
    inferred: [MAC_SA, MAC_DA, VID, ACL]
    values:
      MAC_SA: Priority of the matching source address entry in the forwarding database
      MAC_DA: Priority of the matching destination address entry in the forwarding database
      VID: Priority of the VLAN table entry
      ACL: Priority set by an ACL rule
      DSCP: Priority mapped from the IP DSCP value through :reg:`IPM_DSCP`
      CVLAN_PCP: Priority mapped from the customer VLAN tag through :reg:`IPM_PCP`
      SVLAN_PCP: Priority mapped from the service VLAN tag through :reg:`IPM_PCP`
      PORT: Port default priority from :field:`PORT_QOS.PRIO`
  acl_type:
    title: ACL key types
    desc: Value of :field:`ACL_KEY.TYPE`; it selects which layout the rest of the key slot uses.
    values:
      NA: Slot not used
      MAC_DA0: Destination MAC address bits 47 to 16
      MAC_SA0: Source MAC address bits 47 to 16
      MAC_DA1_SA1: Destination and source MAC address bits 15 to 0
      VLAN: VLAN identifiers and priorities with tag format
      VTAG: VLAN identifiers and priorities
      IPV4_DA: IPv4 destination address
      IPV4_SA: IPv4 source address
      IPV6_DA0: IPv6 destination address bits 127 to 96
      IPV6_DA1: IPv6 destination address bits 95 to 64
      IPV6_DA2: IPv6 destination address bits 63 to 32
      IPV6_DA3: IPv6 destination address bits 31 to 0
      IPV6_SA0: IPv6 source address bits 127 to 96
      IPV6_SA1: IPv6 source address bits 95 to 64
      IPV6_SA2: IPv6 source address bits 63 to 32
      IPV6_SA3: IPv6 source address bits 31 to 0
      MISC: IP and TCP header fields. The fields are the IP protocol and the type of service and the TCP flags and the frame class
      L4: TCP or UDP source and destination ports
      UDF0: User-defined field windows 0 and 1
      UDF1: User-defined field windows 2 and 3
      UDF2: User-defined field windows 4 and 5
      UDF3: User-defined field windows 6 and 7
      UDF4: User-defined field windows 8 and 9
      UDF5: User-defined field windows 10 and 11
      UDF6: User-defined field windows 12 and 13
      UDF7: User-defined field windows 14 and 15
      ETHERTYPE: EtherType
  l2_type:
    title: Layer 2 frame formats
    desc: "Frame encapsulation code matched by the :field:`L2_TYPE <ACL_KEY.MAC_DA1_SA1_L2_TYPE>` field of an ACL key."
    inferred: [ETH]
    values: {ETH: "Other Ethernet framing. The meaning is :ev:`inferred` from the name.", ETHV2: Ethernet II, ETHSAP: "`IEEE 802.3 <https://en.wikipedia.org/wiki/IEEE_802.3>`__ with LLC", ETHSNAP: "`IEEE 802.3 <https://en.wikipedia.org/wiki/IEEE_802.3>`__ with LLC and SNAP"}
  l3_type:
    title: Layer 3 protocol classes
    desc: "Protocol class matched by the :field:`L3_TYPE <ACL_KEY.MAC_ADDR0_L3_TYPE>` field of an ACL key."
    values: {OTHER: Any other protocol, IPV4: IPv4, IPV6: IPv6, ARP: ARP, LLDP: LLDP, PAE: "`IEEE 802.1X <https://en.wikipedia.org/wiki/IEEE_802.1X>`__ port access entity", ERP: "Ethernet ring protection. The meaning is :ev:`inferred` from the name; :lx:`yt921x_acl_rule_ext_parse_flow_entries` selects the value for the EtherType ``ETH_P_CFM``.", SLOW_PROTOCOL: "`IEEE 802.3 <https://en.wikipedia.org/wiki/IEEE_802.3>`__ slow protocols such as LACP"}
  l4_type:
    title: Layer 4 protocol classes
    desc: "Protocol class matched by the :field:`L4_TYPE <ACL_KEY.IPV4_L4_TYPE>` field of an ACL key."
    values: {OTHER: Any other protocol, TCP: TCP, UDP: UDP, UDPLITE: UDP-Lite, ICMP: ICMP, IGMP: IGMP, MLD: Multicast Listener Discovery, ND: IPv6 Neighbour Discovery}
  udf_type:
    title: User-defined field bases
    desc: Header that a user-defined field offset is counted from, in :field:`UDF_CTRL.UDF_TYPE`.
    values: {L2: Start of the Ethernet header, L3: Start of the layer 3 header, L4: Start of the layer 4 header}


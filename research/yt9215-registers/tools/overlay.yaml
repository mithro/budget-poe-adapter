constants:
  SWITCHID_NUM: Number of switch IDs that can share one MDIO address
  EDATA_EXTMODE: Address of the extended mode byte in the configuration byte store
  EDATA_LEN: Size of the configuration byte store in bytes
  FDB_NUM: Number of forwarding database entries
  MSTI_NUM: Number of spanning tree instances
  METER_NUM: Number of general-purpose meters. The 11 per-port meters follow them
  LAG_NUM: Number of link aggregation groups
  LAG_PORT_NUM: Member slots in one link aggregation group
  PRIO_NUM: Number of internal priorities
  MAJOR_YT9215: ":field:`CHIP_ID.MAJOR` of the YT9215 family"
  MAJOR_YT9218: ":field:`CHIP_ID.MAJOR` of the YT9218 family"
  RST_DELAY_US: Microseconds to wait after starting a hardware reset
  FRAME_SIZE_MAX: "Largest value of :field:`MAC_FRAME.SIZE` in bytes"
  TAG_LEN: Length of the CPU tag in bytes
  ACL_BLK_NUM: Number of ACL blocks
  UDF_NUM: Number of user-defined field windows
  LED_GROUP_NUM: LED groups per port
  LED_PORT_NUM: Ports that have LED outputs
  PORT_NUM: Number of switch ports. The count includes port 10 of the built-in microcontroller
  LED_BLINK_MIN: Shortest LED blink cycle in milliseconds
  LED_BLINK_DEF: Default LED blink cycle in milliseconds
  LED_BLINK_MAX: Longest LED blink cycle in milliseconds
  TOKEN_BYTE_C: Token scale exponent in byte mode. One token is 2^1 bytes at unit 0
  TOKEN_PKT_C: Token scale exponent in packet mode. One token is 2^-6 packets at unit 0
  TOKEN_RATE_C: Extra exponent applied to rate tokens
  METER_SLOT_MIN: "Smallest allowed :field:`METER_SLOT.SLOT`"
  PORT_SHAPE_SLOT_MIN: "Smallest allowed :field:`PORT_SHAPE_SLOT.SLOT`"
  ACL_ENT_PER_BLK: Key slots in one ACL block
  ACL_NUM: Number of ACL action entries
  ACL_ORD_NUM: Number of ACL rule order values


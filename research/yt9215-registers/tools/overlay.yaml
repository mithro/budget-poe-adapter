registers:
  RST:
    block: system
    title: Reset control
    desc: |
      Starts a reset of the switch. Write :field:`RST.HW` and poll the register until it reads 0;
      :ref:`Reset <bringup-reset>` gives the full sequence.
    fields:
      HW: {desc: "Write 1 to reset the whole chip. The bit clears itself when the reset is complete. Section 4.1.2.1 of the |ds| calls the bit CHIP_RESET."}
      SW: {desc: "Write 1 for a software reset. Section 4.1.2.2 of the |ds| calls the bit SW_RESET. It states that the bit clears itself and resets what :field:`RST.HW` resets except the analog circuit of the built-in PHYs. No function of the :ref:`Linux driver <sources-list>` uses the bit."}
  FUNC:
    block: system
    title: Function enables
    desc: |
      Switches optional function blocks on.
    fields:
      METER: {desc: "Enables the meters. The meter registers are :reg:`METER_CTRL` and :reg:`PORT_METER`."}
      ACL: {desc: "Enables the access control list. Its registers include :reg:`ACL_KEY` and :reg:`ACL_ACT`."}
      MIB: {desc: "Enables the port counters of :reg:`MIB_DATA`."}
  CHIP_ID:
    block: system
    title: Chip identification
    access: ro
    desc: |
      Identifies the chip family. Read it before the reset, as described in
      :ref:`Find the switch <bringup-probe>`.
    add_fields:
      MINOR: {lsb: 0, width: 16, desc: "Lower half of the chip ID. The file `fal_tiger_init.c <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_init.c#L133>`__ of the :ref:`vendor SDK <sources-list>` tests it for the value 1. The meaning of its values is :ev:`not known`.", inferred: true}
    fields:
      MAJOR: {desc: "Family code. ``0x9002`` is the :ref:`YT9215 family <reference-parts>` and ``0x9001`` the :ref:`YT9218 family <reference-parts>`."}
  CHIP_MODE:
    block: system
    title: Package variant
    access: ro
    desc: |
      Tells the parts of one family apart. :ref:`reference-parts` lists the value of each
      part.
    fields:
      MODE: {desc: "Package variant code."}
  SYS_CLK:
    block: system
    title: System clock select
    desc: |
      Shows which core clock the switch runs from. :lx:`yt921x_chip_detect` reads it. The time
      slots of :reg:`METER_SLOT` and :reg:`PORT_SHAPE_SLOT` count in units of eight core clock
      periods.
    fields:
      SEL:
        desc: "Core clock in use. Value 0 stands for 125 MHz in the YT9215 family and 167 MHz in the YT9218 family. The :ref:`core clock table <bringup-clock-table>` lists the clock periods."
        values: {125M: "125 MHz core clock", 167M: "167 MHz core clock", 143M: "143 MHz core clock"}
  IO_LEVEL:
    block: system
    title: I/O voltage select
    desc: |
      Sets the signalling voltage of the digital pins. The field positions differ between the
      YT9215 and YT9218 families.
    fields:
      NORMAL:
        desc: "Voltage of the general digital I/O pins."
        values: {3V3: "3.3 V", 1V8: "1.8 V"}
      RGMII0:
        desc: "Voltage of the first xMII interface pins."
        values: {3V3: "3.3 V", 2V5: "2.5 V", 1V8: "1.8 V"}
      RGMII1:
        desc: "Voltage of the second xMII interface pins."
        values: {3V3: "3.3 V", 2V5: "2.5 V", 1V8: "1.8 V"}
  MAC_ADDR_HI2:
    block: system
    title: Switch MAC address, high part
    desc: |
      Two bytes of the MAC address of the switch. It is :ev:`inferred` from the name that
      the switch uses the address as the source address of frames it sends itself, such as
      pause frames. :ref:`bringup-mac` gives the two readings of the byte order.
    inferred: true
    add_fields:
      ADDR: {lsb: 0, width: 16, desc: "Two bytes of the MAC address. The register name reads as the first two bytes of the address, which is :ev:`inferred`. The :ref:`vendor SDK <sources-list>` reads the field as the last two bytes, with byte 4 in bits 15 to 8. It is :ev:`not known` which is right.", inferred: true}
  MAC_ADDR_LO4:
    block: system
    title: Switch MAC address, low part
    desc: |
      Four bytes of the MAC address of the switch; see :reg:`MAC_ADDR_HI2`.
    inferred: true
    add_fields:
      ADDR: {lsb: 0, width: 32, desc: "Four bytes of the MAC address. The register name reads as the last four bytes of the address, which is :ev:`inferred`. The :ref:`vendor SDK <sources-list>` reads the field as the first four bytes, with byte 0 in bits 31 to 24. It is :ev:`not known` which is right.", inferred: true}
  PON_STRAP_FUNC:
    block: system
    title: Pin strap override enable
    desc: |
      Selects, per function, whether the switch uses the level sampled on the strap pin at
      power-on (bit clear) or the value in :reg:`PON_STRAP_VAL` (bit set). This split between the
      two registers is :ev:`inferred` from their names. :lx:`yt921x_set_eee` writes the same value
      to the EEE bit of both.
    fields:
      EEE: {desc: "Take the Energy Efficient Ethernet setting from :field:`PON_STRAP_VAL.EEE`. :lx:`yt921x_set_eee` sets this bit together with :field:`PON_STRAP_VAL.EEE` to turn the function on; the role of each bit alone is :ev:`inferred` from the register names."}
      LOOP_DETECT: {desc: "Take the loop detection setting from :field:`PON_STRAP_VAL.LOOP_DETECT`.", inferred: true}
  PON_STRAP_VAL:
    block: system
    title: Pin strap override value
    desc: |
      It is :ev:`inferred` from the register names that the switch uses these values in place
      of the power-on straps for every function whose bit is set in :reg:`PON_STRAP_FUNC`.
    fields:
      EEE: {desc: "1 turns Energy Efficient Ethernet on. :lx:`yt921x_set_eee` sets this bit together with :field:`PON_STRAP_FUNC.EEE`; the role of each bit alone is :ev:`inferred` from the register names."}
      LOOP_DETECT: {desc: "Loop detection strap value. The :ref:`vendor SDK <sources-list>` function `fal_tiger_loop_detect_enable_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_loopdetect.c#L13>`__ clears this bit and sets :field:`PON_STRAP_FUNC.LOOP_DETECT` to turn loop detection on, and its comment calls the strap \"dis lpd strap\". By that code 1 turns loop detection off.", inferred: true}
  PON_STRAP_CAP:
    block: system
    title: Pin strap capture
    access: ro
    desc: |
      Levels that were sampled on the strap pins at power-on.
    inferred: true
    fields:
      EEE: {desc: "Captured Energy Efficient Ethernet strap.", inferred: true}
      LOOP_DETECT: {desc: "Captured loop detection strap.", inferred: true}
  SENSOR:
    block: system
    title: Sensor enable
    desc: |
      Enables the on-chip sensors.
    fields:
      TEMP: {desc: "Enables the temperature sensor that :reg:`TEMP` reads."}
  TEMP:
    block: system
    title: Temperature sensor reading
    access: ro
    desc: |
      Reading of the temperature sensor. No function of the :ref:`Linux driver <sources-list>`
      reads the register. :ref:`bringup-temp` gives the conversion that the
      :ref:`vendor SDK <sources-list>` uses.
    inferred: true
    add_fields:
      VALUE: {lsb: 0, width: 32, desc: "Sensor value. The :ref:`vendor SDK <sources-list>` function `fal_tiger_sensor_temp_value_get() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_sensor.c#L44>`__ uses bits 15 to 0, in steps of 1/128 °C.", inferred: true}
  EDATA_CTRL:
    block: system
    title: Configuration byte store command
    desc: |
      Command register of the configuration byte store of 256 bytes. Writing it starts the
      command; :ref:`Identify the part <bringup-identify>` shows the read sequence.
    fields:
      ADDR: {desc: "Byte address from 0 to 255."}
      OP:
        desc: "Command."
        values: {READ: "Read the byte at ADDR into :field:`EDATA_DATA.DATA`"}
  EDATA_DATA:
    block: system
    title: Configuration byte store data and status
    access: ro
    desc: |
      Result and state of the last :reg:`EDATA_CTRL` command.
    fields:
      DATA: {desc: "Byte that was read."}
      STATUS:
        desc: "State of the store."
        values: {IDLE: "No command is running. DATA is valid"}

  EXT_CPU_PORT:
    block: cpu
    title: External CPU port
    desc: |
      Names the port that leads to the host CPU and turns CPU tagging on for it; see
      :ref:`CPU port and frame tag <cpu-tag>`.
    fields:
      TAG_EN: {desc: "Frames to and from the CPU port carry the 8-byte CPU tag."}
      PORT_EN: {desc: "PORT is valid and that port is treated as the CPU port."}
      PORT: {desc: "Number of the CPU port from 0 to 10."}
  CPU_TAG_TPID:
    block: cpu
    title: CPU tag EtherType
    reset: 0x9988
    desc: |
      EtherType that opens the CPU tag. Reading the reset value back is a cheap check that
      register access works.
    fields:
      TPID: {desc: "EtherType of the CPU tag."}
  CPU_COPY:
    block: cpu
    title: CPU copy destination
    desc: |
      Chooses where frames that are trapped or copied to the CPU go.
    fields:
      FORCE_INT_PORT: {desc: "Always send such frames to the built-in microcontroller port.", inferred: true}
      TO_INT_CPU: {desc: "Send such frames to the built-in microcontroller on port 10.", inferred: true}
      TO_EXT_CPU: {desc: "Send such frames to the external CPU port set in :reg:`EXT_CPU_PORT`."}

  PORT_CTRL:
    block: port
    title: Port control
    desc: |
      Forces or negotiates the MAC settings of one port. Bits 7 to 0 have the same layout as
      :reg:`PORT_STATUS`; it is :ev:`inferred` from the name of :field:`PORT_CTRL.LINK_AN` that with the bit clear
      the MAC uses the values written here. :ref:`Bring a port up <ports-up>` gives the order of writes.
    fields:
      PAUSE_AN: {desc: "Take the pause settings from in-band negotiation. :lx:`yt921x_serdes_config` sets the bit for a SerDes link with in-band negotiation other than SGMII. It is :ev:`inferred` from the name that RX_PAUSE and TX_PAUSE are then ignored."}
      LINK_AN: {desc: "Take speed and duplex from the in-band status. :lx:`yt921x_serdes_config` sets the bit for a SerDes link with in-band status. It is :ev:`inferred` from the name that the bit also follows a built-in PHY and that the forced bits are then ignored."}
      HALF_PAUSE: {desc: "Use back pressure for flow control in half duplex."}
      DUPLEX_FULL: {desc: "Forced full duplex."}
      RX_PAUSE: {desc: "Honour received pause frames."}
      TX_PAUSE: {desc: "Send pause frames when the port is congested."}
      RX_MAC_EN: {desc: "Enables the receive side of the MAC."}
      TX_MAC_EN: {desc: "Enables the transmit side of the MAC."}
      SPEED: {desc: "Forced speed.", enum: speed}
  PORT_STATUS:
    block: port
    title: Port status
    access: ro
    desc: |
      Link state and the MAC settings one port is running with.
    fields:
      LINK: {desc: "1 while the link is up."}
      DUPLEX_FULL: {desc: "1 for full duplex."}
      RX_PAUSE: {desc: "Receive pause is active."}
      TX_PAUSE: {desc: "Transmit pause is active."}
      RX_MAC_EN: {desc: "The receive side of the MAC is enabled."}
      TX_MAC_EN: {desc: "The transmit side of the MAC is enabled."}
      SPEED: {desc: "Current speed.", enum: speed}
  MAC_FRAME:
    block: port
    title: MAC frame size
    desc: |
      Largest frame the MAC of one port accepts.
    fields:
      SIZE: {desc: "Maximum frame length in bytes. The length counts from the destination address to the frame check sequence. The largest value is 0x2400 (9216).", unit: bytes}
  SERDES_CTRL:
    block: port
    title: SerDes enable
    desc: |
      Enables the SGMII SerDes of ports 8 and 9, as :lx:`yt921x_port_config` does. A port uses either its SerDes or its xMII pins;
      clear the matching bit in :reg:`XMII_CTRL` when setting one here.
    fields:
      TEST: {desc: ":lx:`yt921x_chip_setup` clears the bit. It is :ev:`inferred` from the name that the bit selects a test mode of the SerDes. The file `fal_tiger_init.c <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_init.c#L140>`__ of the :ref:`vendor SDK <sources-list>` clears the bit together with the two port bits under a comment with the lines \"disable sds intf,will be enabled when config sds mode\" and \"set to mdio access mode\"."}
      PORTn: {desc: "Bit 0 enables the SerDes of port 8. Bit 1 enables the SerDes of port 9."}
  SERDES:
    block: port
    title: SerDes mode and forced link
    desc: |
      Protocol of one SerDes and, when the link is not negotiated in-band, its forced link
      settings. The SerDes PCS registers themselves are standard MDIO registers reached through
      the :ref:`internal MDIO master <phy-mbus>` at the address of the port number.
    fields:
      MODE:
        desc: "SerDes protocol."
        values: {SGMII: "SGMII as the MAC side", REVSGMII: "SGMII as the PHY side", 1000BASEX: "1000BASE-X", 100BASEX: "100BASE-FX fibre mode", 2500BASEX: "2500BASE-X"}
      RX_PAUSE: {desc: "Forced receive pause."}
      TX_PAUSE: {desc: "Forced transmit pause."}
      LINK: {desc: "Forces the link up."}
      DUPLEX_FULL: {desc: "Forced full duplex."}
      SPEED: {desc: "Forced speed.", enum: speed}
  XMII_CTRL:
    block: port
    title: xMII enable
    desc: |
      Selects the parallel MAC interface (MII, RMII or RGMII) pins of ports 8 and 9. The bit
      order is the reverse of the port order. :lx:`yt921x_port_config` clears the bit of a port
      that uses its SerDes. The :ref:`vendor SDK <sources-list>` function
      `fal_tiger_port_extif_mode_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_port.c#L687>`__
      sets the bit for an xMII mode, under the comment "select xmii mode".
    fields:
      PORTn: {desc: "Bit 1 selects the xMII pins of port 8. Bit 0 selects the xMII pins of port 9."}
  XMII:
    block: port
    title: xMII mode and timing
    desc: |
      Mode, clock direction and RGMII delays of one parallel MAC interface.
    fields:
      MODE:
        desc: "Interface type."
        values: {MII: "MII as the MAC side", REVMII: "MII as the PHY side", RMII: "RMII as the MAC side", REVRMII: "RMII as the PHY side", RGMII: "RGMII", DISABLE: "Interface off"}
      LINK: {desc: "Forces the link of the interface up."}
      EN: {desc: "Enables the interface.", inferred: true}
      SOFT_RST: {desc: "Resets the interface logic.", inferred: true}
      RGMII_TX_DELAY_150PS: {desc: "Fine RGMII transmit clock delay in steps of 150 ps. A `comment in fal_tiger_port.c <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_port.c#L1010>`__ of the :ref:`vendor SDK <sources-list>` gives the transmit clock delay as 2 ns times :field:`XMII.RGMII_TX_DELAY_2NS` plus 0.15 ns times this field.", inferred: true}
      TX_CLK_IN: {desc: "The Linux name reads as: the transmit clock pin is an input. The :ref:`vendor SDK <sources-list>` names the bit XMII_TXC_IN_SEL, and its function `fal_tiger_port_extif_xmiiClk_invert_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_port.c#L1671>`__ writes the bit as the enable of an inverted xMII clock. The two readings disagree, and it is :ev:`not known` which is right.", inferred: true}
      RX_CLK_IN: {desc: "The receive clock pin is an input.", inferred: true}
      RGMII_TX_DELAY_2NS: {desc: "Adds 2 ns to the delay of the RGMII transmit clock, by the `comment in fal_tiger_port.c <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_port.c#L1010>`__ of the :ref:`vendor SDK <sources-list>`.", inferred: true}
      RGMII_TX_CLK_OUT: {desc: "Drives the RGMII transmit clock.", inferred: true}
      RGMII_RX_DELAY_150PS: {desc: "RGMII receive clock delay in steps of 150 ps, by the `comment in fal_tiger_port.c <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_port.c#L1010>`__ of the :ref:`vendor SDK <sources-list>`.", inferred: true}
      RMII_PHY_TX_CLK_OUT: {desc: "Drives the RMII reference clock when the switch is the PHY side.", inferred: true}
      REVMII_TX_CLK_OUT: {desc: "Drives the MII transmit clock when the switch is the PHY side.", inferred: true}
      REVMII_RX_CLK_OUT: {desc: "Drives the MII receive clock when the switch is the PHY side.", inferred: true}
  MDIO_POLLING:
    block: port
    title: External port link override
    desc: |
      Link state of port 8 or 9. :lx:`yt921x_port_up` writes the link state here for an
      external port that does not use its SerDes. It is :ev:`inferred` from the name that the switch
      otherwise learns the state by polling a PHY on the external MDIO bus.
    fields:
      DUPLEX_FULL: {desc: "1 for full duplex."}
      LINK: {desc: "1 for link up."}
      SPEED: {desc: "Link speed.", enum: speed}

  EXT_MBUS_OP:
    block: mbus
    title: External MDIO master start
    desc: |
      Starts a transfer on the external MDIO master and shows when it has finished; see
      :ref:`MDIO master transfer <phy-mbus>`.
    fields:
      START: {desc: "Write 1 to start the transfer set up in :reg:`EXT_MBUS_CTRL`. Reads 1 until the transfer is complete."}
  INT_MBUS_OP:
    block: mbus
    title: Internal MDIO master start
    desc: |
      Starts a transfer on the internal MDIO master and shows when it has finished; see
      :ref:`MDIO master transfer <phy-mbus>`.
    fields:
      START: {desc: "Write 1 to start the transfer set up in :reg:`INT_MBUS_CTRL`. Reads 1 until the transfer is complete."}
  EXT_MBUS_CTRL:
    block: mbus
    title: External MDIO master command
    desc: |
      Address and direction of the next transfer on the external MDIO pins.
    fields: &mbusctrl
      PORT: {desc: "PHY address from 0 to 31. On the internal bus it equals the port number."}
      REG: {desc: "PHY register number from 0 to 31."}
      TYPE:
        desc: "Frame format. The :lx:`comment on the field <mdio_bus.h:22>` reads \"wild guess\", so the width of the field is :ev:`inferred`."
        values: {C22: "`IEEE 802.3 clause 22 <https://en.wikipedia.org/wiki/Management_Data_Input/Output>`__ frame"}
      OP:
        desc: "Direction. The :lx:`comment on the field <mdio_bus.h:25>` reads \"wild guess\", so the width of the field is :ev:`inferred`."
        values: {WRITE: "Write the register", READ: "Read the register"}
  INT_MBUS_CTRL:
    block: mbus
    title: Internal MDIO master command
    desc: |
      Address and direction of the next transfer to a built-in PHY or SerDes PCS.
    fields: *mbusctrl
  EXT_MBUS_DOUT:
    block: mbus
    title: External MDIO master write data
    desc: Data for the next write transfer on the external MDIO master.
    add_fields: &mbusdata
      DATA: {lsb: 0, width: 16, desc: "The 16-bit PHY register value."}
  INT_MBUS_DOUT:
    block: mbus
    title: Internal MDIO master write data
    desc: Data for the next write transfer on the internal MDIO master.
    add_fields: *mbusdata
  EXT_MBUS_DIN:
    block: mbus
    title: External MDIO master read data
    access: ro
    desc: Data returned by the last read transfer on the external MDIO master.
    add_fields: *mbusdata
  INT_MBUS_DIN:
    block: mbus
    title: Internal MDIO master read data
    access: ro
    desc: Data returned by the last read transfer on the internal MDIO master.
    add_fields: *mbusdata

  EEE_VAL:
    block: eee
    title: Port EEE value
    desc: |
      Per-port Energy Efficient Ethernet bit that :lx:`yt921x_set_eee` sets and clears together
      with :field:`EEE_CTRL.EN` of the port. It is :ev:`not known` what the bit does alone.
    fields:
      DATA: {desc: "Set to turn Energy Efficient Ethernet on for the port and cleared to turn it off, as :lx:`yt921x_set_eee` does."}
  EEE_CTRL:
    block: eee
    title: EEE port enable
    desc: |
      One Energy Efficient Ethernet enable bit per port; see :ref:`Energy Efficient Ethernet <ports-eee>`.
    fields:
      ENn: {desc: "Enables Energy Efficient Ethernet on port ``port``."}

  MIB_CTRL:
    block: mib
    title: Counter control
    desc: |
      Clears port counters.
    inferred: true
    fields:
      CLEAN: {desc: "Write 1 to clear the selected counters.", inferred: true}
      PORT: {desc: "Port whose counters are cleared when ONE_PORT is set.", inferred: true}
      ONE_PORT: {desc: "Clear the counters of the port in PORT.", inferred: true}
      ALL_PORT: {desc: "It is :ev:`inferred` from the name that the bit clears the counters of every port. The :ref:`vendor SDK <sources-list>` function `fal_tiger_stat_mib_clear_all() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_stat.c#L69>`__ leaves the bit at 0 for a clear of every port.", inferred: true}
  MIB_DATA:
    block: mib
    title: Port counter block
    access: ro
    desc: |
      Start of the counter block of one port. Each counter sits at a fixed byte offset inside
      the block, listed in :ref:`Port counters <mib-counters>`.
    add_fields:
      COUNT: {lsb: 0, width: 32, desc: "Counter value. For a 64-bit counter it is the low 32 bits."}

  LED_CTRL:
    block: led
    title: LED global control
    desc: |
      Chooses between parallel and serial LED outputs and sets the loop detection blink rate.
    inferred: true
    fields:
      UNK: {desc: "The :ref:`vendor SDK <sources-list>` function `fal_tiger_led_enable() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L123>`__ sets the bit under the comment \"enabel LED\". The :ref:`Linux driver <sources-list>` does not name its function.", inferred: true}
      LOOPDETECT_BLINK: {desc: "Blink cycle that signals a detected loop. The :lx:`comment on the field <leds.h:16>` gives the cycle as 512 ms times the field value. The :ref:`vendor SDK <sources-list>` list `yt_led_loopdetect_blink_rate_t <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_led.h#L79>`__ gives 512 ms for the value 0 and 2048 ms for the value 3, which is 512 ms times the field value plus one. It is :ev:`not known` which is right.", inferred: true}
      PORT_NUM: {desc: "Number of ports shifted out in serial mode.", inferred: true}
      MODE:
        desc: "LED output mode."
        inferred: true
        values: {PARALLEL: "One pin per LED", SERIAL: "LED states shifted out on a clock and data pin pair"}
  LED0_PORT:
    block: led
    title: LED group 0 behaviour
    desc: |
      Conditions that light or blink LED 0 of one port. It is :ev:`inferred` from
      :lx:`yt921x_led_trigger_set`, which sets several bits at once, that each set bit adds one
      condition and that the LED shows the combination. :ref:`LEDs <leds>` explains the three LED groups.
    fields:
      ACT: {desc: "All behaviour bits of this LED as one mask.", group: true}
      ACT_LINK_TRY_DIS: {desc: "Only LED 0 has the field. The :ref:`vendor SDK <sources-list>` `action list <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L40>`__ names the bit LED_ACTION_DISABLE_LINK_TRY, and `fal_tiger_led_action_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L320>`__ sets it for LED 0 in every case, under the comment \"tiger must set disable_link_try bit to 1\". The :ref:`Linux driver <sources-list>` disagrees: :lx:`yt921x_led_trigger_set` writes LED 0 with a mask that holds this bit and never sets it, so it clears the bit. What the bit does is :ev:`not known`.", inferred: true}
      ACT_COLLISION_BLINK_INDI: {desc: "Only LED 0 has the field. The :ref:`vendor SDK <sources-list>` `action list <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L39>`__ names the bit LED_ACTION_COLLISION_BLINK. It is :ev:`inferred` from the name that the LED blinks on a collision.", inferred: true}
      <<: &ledact
        ACT_EEE_BLINK: {desc: "Blink while the port is in low power idle.", inferred: true}
        ACT_LOOPDETECT_BLINK: {desc: "Blink when a loop is detected on the port.", inferred: true}
        ACT_ACTIVE_BLINK: {desc: "Blink on any activity.", inferred: true}
        ACT_DUPLEX_FULL: {desc: "On while the link is up in full duplex."}
        ACT_DUPLEX_HALF: {desc: "On while the link is up in half duplex."}
        ACT_TX_BLINK: {desc: "Blink while frames are sent."}
        ACT_RX_BLINK: {desc: "Blink while frames are received."}
        ACT_TX: {desc: "On while frames are sent.", inferred: true}
        ACT_RX: {desc: "On while frames are received.", inferred: true}
        ACT_1000M: {desc: "On while the link is up at 1000 Mbit/s."}
        ACT_100M: {desc: "On while the link is up at 100 Mbit/s."}
        ACT_10M: {desc: "On while the link is up at 10 Mbit/s."}
        ACT_COLLISION_BLINK: {desc: "Blink on collisions."}
        ACT_1000M_BLINK: {desc: "Blink on activity at 1000 Mbit/s.", inferred: true}
        ACT_100M_BLINK: {desc: "Blink on activity at 100 Mbit/s.", inferred: true}
        ACT_10M_BLINK: {desc: "Blink on activity at 10 Mbit/s.", inferred: true}
  LED1_PORT:
    block: led
    title: LED group 1 behaviour and blink timing
    desc: |
      Conditions that light or blink LED 1 of one port, plus the blink timing shared by all
      three LEDs of the port.
    fields:
      OTHER_BLINK: {desc: "Alternative blink cycle. The cycle is 512 ms shifted right by the field value. An LED uses it when its :field:`LED2_PORT.FORCE_BLINK` field is 3."}
      EEE_BLINK: {desc: "Blink cycle of the low power idle indication. The cycle is 512 ms shifted right by the field value.", inferred: true}
      BLINK_DUTY_COMP: {desc: "Swaps the on and off parts of the blink cycle. BLINK_DUTY then gives the off fraction."}
      BLINK_DUTY:
        desc: "Fraction of the blink cycle the LED is on."
        values: {'1_2': "On for 1/2 of the cycle", '2_3': "On for 2/3 of the cycle", '3_4': "On for 3/4 of the cycle", '5_6': "On for 5/6 of the cycle"}
      ACT: {desc: "All behaviour bits of this LED as one mask.", group: true}
      <<: *ledact
  LED2_PORT:
    block: led
    title: LED group 2 behaviour and forced states
    desc: |
      Conditions that light or blink LED 2 of one port, plus the forced state of all three LEDs
      of the port.
    fields:
      FORCEn:
        desc: "Forced state of LED group ``grp`` of this port."
        values: {DONTCARE: "Not forced. The LED follows its behaviour bits", BLINK: "Blink at the rate in FORCE_BLINK", "ON": "On", "OFF": "Off"}
      FORCE_BLINKn:
        desc: "Blink cycle of an LED that is forced to blink. The cycle is 512 ms shifted left by the field value."
        values: {OTHER: "Use the cycle in :field:`LED1_PORT.OTHER_BLINK`"}
      ACT: {desc: "All behaviour bits of this LED as one mask.", group: true}
      <<: *ledact
  LED_SER_CTRL:
    block: led
    title: Serial LED control
    desc: |
      Settings of the serial LED output.
    inferred: true
    fields:
      UNK: {desc: "The :ref:`vendor SDK <sources-list>` function `fal_tiger_led_serial_enable_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L1013>`__ sets both bits to turn the serial LED output on and clears both to turn it off. The :lx:`comment on the field <leds.h:68>` in the :ref:`Linux driver <sources-list>` reads \"delay?\".", inferred: true}
      ACTIVE_LOW: {desc: "Serial LED data is active low.", inferred: true}
      GRP_NUM: {desc: "Number of LED groups shifted out per port minus one.", inferred: true}
  LED_SER_MAP:
    block: led
    title: Serial LED position map
    desc: |
      Chooses which LED is shifted out at each position of the serial stream. One register
      holds five positions; index ``half`` is 0 for ports 0 to 4 and 1 for ports 5 to 9.
    inferred: true
    fields:
      DSTn_PORT: {desc: "Port whose LED is shown at position ``slot``.", inferred: true}
      DSTn_LED: {desc: "LED group shown at position ``slot``.", inferred: true}
  LED_PAR_PORTS:
    block: led
    title: Parallel LED port enable
    desc: |
      Parallel LED outputs in use. The :ref:`Linux driver <sources-list>` defines the address only.
    inferred: true
    add_fields:
      VALUE: {lsb: 0, width: 32, desc: "The :ref:`vendor SDK <sources-list>` function `fal_tiger_led_parallel_output_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_led.c#L1080>`__ writes a port mask to bits 9 to 0, one bit per port, under the comment \"select output port mask of parallel LED\". Bits 31 to 10 are :ev:`not known`.", inferred: true}
  LED_PAR_INV:
    block: led
    title: Parallel LED polarity
    desc: |
      Inverts individual parallel LED outputs. With the bit clear the pin is low while the LED is on, which suits an LED wired active low; set the bit for an LED wired active high.
    fields:
      INVnm: {desc: "Inverts the output of one LED group of one port. The bit number is 10 × grp + port."}
  LED_PAR_MAP:
    block: led
    title: Parallel LED pin map
    desc: |
      Chooses which LED each parallel LED pin of one port position shows.
    inferred: true
    fields:
      DSTn_PORT: {desc: "Port whose LED is shown on pin group ``grp``.", inferred: true}
      DSTn_LED: {desc: "LED group shown on pin group ``grp``.", inferred: true}

  PVID_SEL:
    block: vlan
    title: Lookup VLAN select
    desc: |
      Chooses, per port, which VLAN tag selects the VLAN table entry.
    inferred: true
    fields:
      SVID_PORTn: {desc: "Port ``port`` looks frames up by the service VLAN ID. It does not use the customer VLAN ID.", inferred: true}
  PORT_EGR:
    block: vlan
    title: Port egress tag protocol select
    desc: |
      Chooses which :reg:`TPID_EGR` entry a port writes into the VLAN tags it adds on transmit.
    inferred: true
    fields:
      TPID_CTAG: {desc: "Index of the :reg:`TPID_EGR` entry used for customer tags.", inferred: true}
      TPID_STAG: {desc: "Index of the :reg:`TPID_EGR` entry used for service tags.", inferred: true}
  TPID_EGR:
    block: vlan
    title: Egress tag protocol identifiers
    desc: |
      Four tag protocol identifier values a port can write into transmitted VLAN tags.
    inferred: true
    fields:
      TPID: {desc: "Tag protocol identifier. An example is ``0x8100``.", inferred: true}
  TPID_IGR:
    block: vlan
    title: Ingress tag protocol identifiers
    desc: |
      Four tag protocol identifier values the parser can recognise as a VLAN tag.
      :reg:`PORT_IGR_TPID` chooses which of them each port accepts.
    fields:
      TPID: {desc: "Tag protocol identifier. An example is ``0x8100``.", inferred: true}
  PORT_IGR_TPID:
    block: vlan
    title: Port ingress tag recognition
    desc: |
      :lx:`yt921x_vlan_aware_set` writes the register to make a port VLAN-aware or
      VLAN-unaware. It is :ev:`inferred` from the names that the register chooses which
      :reg:`TPID_IGR` entries one port treats as a customer tag and which as a service tag. :ref:`VLAN-aware and VLAN-unaware ports <vlan-aware>` shows how this makes
      a port ignore VLAN tags.
    fields:
      STAG: {desc: "It is :ev:`inferred` from the names that entry ``n`` of :reg:`TPID_IGR` marks a service tag on this port."}
      CTAG: {desc: "It is :ev:`inferred` from the names that entry ``n`` of :reg:`TPID_IGR` marks a customer tag on this port."}
  VLAN_IGR_FILTER:
    block: vlan
    title: Ingress VLAN filter
    desc: |
      Per-port ingress VLAN membership check.
    fields:
      PORTn_BYPASS_IGMP: {desc: "IGMP frames received on port ``port`` skip the ingress membership check.", inferred: true}
      PORTn: {desc: "Port ``port`` receives frames only of VLANs that list it."}
  VLAN_EGR_FILTER:
    block: vlan
    title: Egress VLAN filter
    desc: |
      Per-port egress VLAN membership check.
    inferred: true
    fields:
      PORTn: {desc: "Port ``port`` sends frames only of VLANs that list it.", inferred: true}
  VLAN_CTRL:
    block: vlan
    words: 2
    title: VLAN table entry
    desc: |
      One 64-bit entry per VLAN ID. Write the low word, then the high word.
      :ref:`VLAN table <vlan-table>` shows how to build an entry.
    fields:
      UNTAG_PORTS: {desc: "Ports that send frames of this VLAN without a tag. Each port has one bit."}
      STP_ID: {desc: "Spanning tree instance of this VLAN. It selects the :reg:`STP` register."}
      SVLAN_EN: {desc: "No function of the :ref:`Linux driver <sources-list>` sets it, as the comment in :lx:`yt921x_vlan_aware_set` states. The Linux name reads as a service VLAN enable. The :ref:`vendor SDK <sources-list>` names the bit SVL_EN and sets it in `fal_tiger_vlan_svlMode_enable_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_vlan.c#L71>`__; the `comment on yt_vlan_svlMode_enable_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_vlan.h#L136>`__ reads \"Set vlan svl mode.It will look up fid after enable svl.\" By that comment the bit makes the VLAN use :field:`VLAN_CTRL.FID` for the address lookup, which disagrees with the reading of the Linux name.", inferred: true}
      FID: {desc: "Filtering ID for address learning and lookup. No function of the :ref:`Linux driver <sources-list>` writes it. :lx:`yt921x_fdb_in01` writes the VLAN ID to :field:`FDB_IN1.FID`, so the :ref:`Linux driver <sources-list>` addresses the forwarding database by VLAN ID. The :ref:`vendor SDK <sources-list>` function `fal_tiger_vlan_fid_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_vlan.c#L93>`__ writes the field, and the `comment on yt_vlan_svlMode_enable_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_vlan.h#L136>`__ states that the lookup uses the filtering ID once :field:`VLAN_CTRL.SVLAN_EN` is set. The field crosses the boundary between the two words.", inferred: true}
      LEARN_DIS: {desc: "Source addresses of frames in this VLAN are not learned."}
      PRIO_EN: {desc: "Frames of this VLAN get the priority in PRIO.", inferred: true}
      PRIO: {desc: "VLAN priority. It is a source for :reg:`PORT_PRIO_ORD`.", inferred: true}
      PORTS: {desc: "Member ports. Each port has one bit."}
      BYPASS_1X_AC: {desc: "Frames of this VLAN skip `IEEE 802.1X <https://en.wikipedia.org/wiki/IEEE_802.1X>`__ access control.", inferred: true}
      METER_EN: {desc: "Frames of this VLAN are rate limited by the meter in METER_ID.", inferred: true}
      METER_ID: {desc: "Meter number. It is an index of :reg:`METER_CTRL`.", inferred: true}
  PORT_VLAN_CTRL:
    block: vlan
    title: Port default VLAN
    desc: |
      VLAN IDs and priorities given to frames that arrive on a port without the matching tag.
    fields:
      SVLAN_PRIO_EN: {desc: "The Linux name reads as: use :field:`PORT_VLAN_CTRL.SVLAN_PRIO` as the default service tag priority. The :ref:`vendor SDK <sources-list>` names the bit `PRIORITY_TAG_SVID_EN <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_struct.c#L308>`__, which reads as: give the default service VLAN ID to a priority-tagged frame. No code of either source uses the bit, and it is :ev:`not known` which reading is right.", inferred: true}
      CVLAN_PRIO_EN: {desc: "The Linux name reads as: use :field:`PORT_VLAN_CTRL.CVLAN_PRIO` as the default customer tag priority. The :ref:`vendor SDK <sources-list>` names the bit `PRIORITY_TAG_CVID_EN <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_struct.c#L309>`__, which reads as: give the default customer VLAN ID to a priority-tagged frame. No code of either source uses the bit, and it is :ev:`not known` which reading is right.", inferred: true}
      SVID: {desc: "Default service VLAN ID."}
      CVID: {desc: "Default customer VLAN ID (the port VLAN ID)."}
      SVLAN_PRIO: {desc: "Default service tag priority.", inferred: true}
      CVLAN_PRIO: {desc: "Default customer tag priority.", inferred: true}
  PORT_VLAN_CTRL1:
    block: vlan
    title: Port acceptable frame types
    desc: |
      Drops tagged or untagged frames on receive, per tag kind.
    fields:
      VLAN_RANGE_EN: {desc: "The Linux name reads as an enable of VLAN range matching with the profile in :field:`PORT_VLAN_CTRL1.VLAN_RANGE_PROFILE_ID`. The :ref:`vendor SDK <sources-list>` names the bit VLAN_RANGE_MODE, and `fal_tiger_vlan_trans_mode_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_vlan_translate.c#L186>`__ writes a value of the list `yt_vlan_range_trans_mode_t <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_vlan_translate.h#L34>`__ to it: 0 for the customer tag and 1 for the service tag. By that code the bit selects the tag that range matching uses, which disagrees with the Linux name. It is :ev:`not known` which is right.", inferred: true}
      VLAN_RANGE_PROFILE_ID: {desc: "VLAN range profile number.", inferred: true}
      SVLAN_DROP_TAGGED: {desc: "Drop received frames that carry a service tag.", inferred: true}
      SVLAN_DROP_UNTAGGED: {desc: "Drop received frames that carry no service tag.", inferred: true}
      CVLAN_DROP_TAGGED: {desc: ":lx:`yt921x_vlan_filtering` always clears the bit. It is :ev:`inferred` from the name that a set bit drops received frames that carry a customer tag."}
      CVLAN_DROP_UNTAGGED: {desc: "Drop received frames that carry no customer tag."}

  IPM_DSCP:
    block: qos
    title: DSCP to internal priority map
    desc: |
      Internal priority and colour for each of the 64 IP DSCP values.
    fields: &ipm
      PRIO: {desc: "Internal priority from 0 to 7."}
      COLOR:
        desc: "Drop precedence colour. It is :ev:`inferred` from :field:`METER_CTRL.COLOR_BLIND` that the meters use it."
        inferred_values: [GREEN, RED]
        values: {GREEN: "Lowest drop precedence", YELLOW: "Yellow", RED: "Highest drop precedence"}
  IPM_PCP:
    block: qos
    title: VLAN priority to internal priority map
    desc: |
      Internal priority and colour for each VLAN tag priority. There are two maps (index
      ``map``); each has one entry per drop eligible bit value (``dei``) and priority code
      point (``pcp``). The :ref:`vendor SDK <sources-list>` functions
      `fal_tiger_qos_intPri_cpri_map_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_qos.c#L148>`__
      and
      `fal_tiger_qos_intPri_spri_map_set() <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_qos.c#L195>`__
      write the map number 0 or 1 to :reg:`PORT_QOS` and use it as the index ``map``.
    fields: *ipm
  PORT_QOS:
    block: qos
    title: Port priority
    desc: |
      Port default priority and, by the code of the :ref:`vendor SDK <sources-list>` that the
      description of :reg:`IPM_PCP` names, the choice of :reg:`IPM_PCP` map.
    fields:
      CVLAN_PRIO_MAP_ID: {desc: "Index ``map`` of the :reg:`IPM_PCP` map used for customer tags.", inferred: true}
      SVLAN_PRIO_MAP_ID: {desc: "Index ``map`` of the :reg:`IPM_PCP` map used for service tags.", inferred: true}
      PRIO: {desc: "Port default priority from 0 to 7."}
      PRIO_EN: {desc: "Enables the port default priority."}
  PORT_PRIO_ORD:
    block: qos
    title: Port priority source order
    desc: |
      Ranks the sources of a frame's internal priority on one port. Each source has a 3-bit
      weight. It is :ev:`inferred` that the source with the highest non-zero weight that applies
      to the frame wins; a `comment in yt_qos.h <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_qos.h#L98>`__ of the
      :ref:`vendor SDK <sources-list>` reads "The higher the value, the higher the priority".
      :ref:`Priority sources <qos-sources>` lists the source numbers.
    fields:
      APPm: {desc: "Weight of priority source ``app``. 0 disables the source, except for the port default priority which is enabled by :field:`PORT_QOS.PRIO_EN`."}

  PORT_ISOLATION:
    block: l2
    title: Port isolation
    desc: |
      Destination ports that frames received on one port must not be sent to. This is the
      mechanism that separates ports into groups; see :ref:`Port isolation <forwarding-isolation>`.
    fields:
      BLOCKn: {desc: "Frames received on this port are never sent to port ``port``."}
  STP:
    block: l2
    title: Spanning tree port states
    desc: |
      Port states of one spanning tree instance, two bits per port. A VLAN chooses its
      instance with :field:`VLAN_CTRL.STP_ID`.
    fields:
      PORTn:
        desc: "State of port ``port`` in this instance."
        values: {DISABLED: "Port neither forwards nor learns", LEARNING: "Port learns addresses but does not forward", BLOCKING: "Port neither forwards nor learns. It is :ev:`inferred` from `IEEE 802.1D <https://en.wikipedia.org/wiki/IEEE_802.1D>`__ that the port receives bridge protocol frames", FORWARD: "Port forwards and learns"}
  PORT_LEARN:
    block: l2
    title: Port address learning
    desc: |
      Controls learning of source addresses on one port.
    fields:
      VID_LEARN_MULTI_EN: {desc: "Function :ev:`not known`.", inferred: true}
      VID_LEARN_MODE: {desc: "Function :ev:`not known`.", inferred: true}
      VID_LEARN_EN: {desc: "Function :ev:`not known`.", inferred: true}
      SUSPEND_COPY_EN: {desc: "Copy frames with a not yet learned source address to the CPU.", inferred: true}
      SUSPEND_DROP_EN: {desc: "Drop frames with a not yet learned source address.", inferred: true}
      DIS: {desc: "Disables address learning on the port."}
      LIMIT_EN: {desc: "Enables the limit in LIMIT.", inferred: true}
      LIMIT: {desc: "Largest number of addresses learned on the port. The :ref:`vendor SDK <sources-list>` lists this field as 13 bits wide, at bits 15 to 3.", inferred: true}
      DROP_ON_EXCEEDED: {desc: "Drop frames with a new source address once the limit is reached.", inferred: true}
      MODE:
        desc: "Who learns addresses."
        inferred: true
        values: {AUTO: "The switch learns by itself", AUTO_AND_COPY: "The switch learns and copies the frame to the CPU", CPU_CONTROL: "Only the CPU adds entries"}
  AGEING:
    block: l2
    title: Address ageing interval
    desc: |
      Time base of forwarding database ageing.
    fields:
      INTERVAL: {desc: "Ageing time in units of 5 seconds.", unit: 5 s}

  FDB_IN0:
    block: fdb
    title: Forwarding database command data 0
    desc: |
      First input word of a forwarding database command; see
      :ref:`Forwarding database <fdb>`.
    fields: &fdb0
      ADDR_HI4: {desc: "MAC address bytes 0 to 3. Byte 0 is in bits 31 to 24."}
  FDB_IN1:
    block: fdb
    title: Forwarding database command data 1
    desc: Second input word of a forwarding database command.
    fields: &fdb1
      EGR_PRIO_EN: {desc: "Apply PRIO to frames sent to this address.", inferred: true}
      STATUS:
        desc: "State of the entry."
        inferred_values: [MIN_TIME, MOVE_AGING_MAX_TIME, MAX_TIME, PENDING]
        values: {INVALID: "Entry is empty", MIN_TIME: "Dynamic entry about to age out", MOVE_AGING_MAX_TIME: "Dynamic entry that moved to another port", MAX_TIME: "Dynamic entry just learned or refreshed", PENDING: "Entry waiting for the CPU to confirm it", STATIC: "Static entry that never ages out"}
      FID: {desc: "Filtering ID of the entry. The :ref:`Linux driver <sources-list>` uses the VLAN ID as the filtering ID."}
      ADDR_LO2: {desc: "MAC address bytes 4 and 5. Byte 4 is in bits 15 to 8."}
  FDB_IN2:
    block: fdb
    title: Forwarding database command data 2
    desc: Third input word of a forwarding database command.
    fields: &fdb2
      MOVE_AGING_STATUS: {desc: "Ageing state of an entry that moved between ports.", inferred: true}
      IGR_DROP: {desc: "Drop frames received from this address.", inferred: true}
      EGR_PORTS: {desc: "Ports that frames to this address are sent to. Each port has one bit."}
      EGR_DROP: {desc: "Drop frames sent to this address.", inferred: true}
      COPY_TO_CPU: {desc: "Also copy frames to this address to the CPU.", inferred: true}
      IGR_PRIO_EN: {desc: "Apply PRIO to frames received from this address.", inferred: true}
      PRIO: {desc: "Priority given by this entry. It is a source for :reg:`PORT_PRIO_ORD`.", inferred: true}
      NEW_VID: {desc: "Replacement VLAN ID for frames matching the entry.", inferred: true}
  FDB_OP:
    block: fdb
    title: Forwarding database command
    desc: |
      Selects and starts a forwarding database command. Write the input words first, then this
      register with START set, then wait for :field:`FDB_RESULT.DONE`.
    fields:
      INDEX: {desc: "Entry index from 0 to 4095. It is used when MODE_INDEX is set."}
      MODE_INDEX: {desc: "Addresses the entry by INDEX. Value 0 addresses it by MAC address and filtering ID."}
      FLUSH_MCAST: {desc: "A flush removes multicast entries in place of unicast entries. The :ref:`vendor SDK <sources-list>` list `yt_l2_tbl_op_flush_mode_t <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/core/fal/tiger/fal_tiger_l2.h#L80>`__ gives this meaning to the bit.", inferred: true}
      FLUSH:
        desc: "Scope of a flush."
        values: {ALL: "Every entry of the kind that :field:`FDB_OP.FLUSH_MCAST` selects", PORT: "Entries of the ports in :field:`FDB_IN2.EGR_PORTS`", PORT_VID: "Entries of the ports in :field:`FDB_IN2.EGR_PORTS` with the filtering ID in :field:`FDB_IN1.FID`", VID: "Entries with the filtering ID in :field:`FDB_IN1.FID`"}
      FLUSH_STATIC: {desc: "A flush also removes static entries."}
      NEXT_TYPE:
        desc: "Which entries GET_NEXT walks."
        values: {UCAST_PORT: "Unicast entries of one port", UCAST_VID: "Unicast entries of one filtering ID", UCAST: "All unicast entries", MCAST: "Multicast entries"}
      OP:
        desc: "Command."
        values: {ADD: "Write an entry", DEL: "Delete an entry", GET_ONE: "Read one entry", GET_NEXT: "Read the next used entry after INDEX", FLUSH: "Delete many entries"}
      START: {desc: "Write 1 to start the command."}
  FDB_RESULT:
    block: fdb
    title: Forwarding database command result
    access: ro
    desc: |
      Completion flag and outcome of the last :reg:`FDB_OP` command.
    fields:
      DONE: {desc: "1 when the command has finished."}
      NOTFOUND: {desc: "No entry matched."}
      OVERWRITED: {desc: "The command overwrote an existing entry.", inferred: true}
      INDEX: {desc: "Index of the entry the command acted on."}
  FDB_OUT0:
    block: fdb
    title: Forwarding database result data 0
    access: ro
    desc: "First word of the entry read by a :val:`FDB_OP.OP.GET_ONE` or :val:`FDB_OP.OP.GET_NEXT` command."
    fields: *fdb0
  FDB_OUT1:
    block: fdb
    title: Forwarding database result data 1
    access: ro
    desc: "Second word of the entry read by a :val:`FDB_OP.OP.GET_ONE` or :val:`FDB_OP.OP.GET_NEXT` command."
    fields: *fdb1
  FDB_OUT2:
    block: fdb
    title: Forwarding database result data 2
    access: ro
    desc: "Third word of the entry read by a :val:`FDB_OP.OP.GET_ONE` or :val:`FDB_OP.OP.GET_NEXT` command."
    fields: *fdb2
  FDB_HW_FLUSH:
    block: fdb
    title: Automatic flush
    desc: |
      Lets the switch remove learned addresses on its own.
    inferred: true
    fields:
      ON_LINKDOWN: {desc: "Remove the dynamic entries of a port when its link goes down.", inferred: true}

  FILTER_UNK_UCAST:
    block: flood
    title: Unknown unicast flood filter
    desc: |
      Port mask for flooded frames with an unknown unicast destination. :lx:`yt921x_chip_setup_dsa`
      sets the bit of every port.
    fields: &filter
      PORTS: {desc: "It is :ev:`inferred` from the word \"filter\" in the register name that frames of this class are not flooded to port ``port`` while its bit is set."}
  FILTER_UNK_MCAST:
    block: flood
    title: Unknown multicast flood filter
    desc: "Port mask for flooded frames with an unknown multicast destination. :lx:`yt921x_chip_setup_dsa` sets the bit of every port."
    fields: *filter
  FILTER_MCAST:
    block: flood
    title: Multicast flood filter
    desc: Ports that do not receive multicast frames.
    inferred: true
    fields: *filter
  FILTER_BCAST:
    block: flood
    title: Broadcast flood filter
    desc: Ports that do not receive broadcast frames.
    inferred: true
    fields: *filter
  ACT_UNK_UCAST:
    block: flood
    title: Unknown unicast action
    desc: |
      What the switch does with a frame whose unicast destination is not in the forwarding
      database, chosen per receiving port.
    fields:
      ACTn: &actunk
        desc: "Action for frames received on port ``port``."
        values: {FORWARD: "Flood the frame", TRAP: "Send the frame to the CPU only", DROP: "Discard the frame", COPY: "Flood the frame and copy it to the CPU"}
  ACT_UNK_MCAST:
    block: flood
    title: Unknown multicast action
    desc: |
      What the switch does with a frame whose multicast destination is not in the forwarding
      database, chosen per receiving port.
    fields:
      BYPASS_DROP_RMA: {desc: "Reserved multicast addresses are exempt from the DROP action.", inferred: true}
      BYPASS_DROP_IGMP: {desc: "IGMP frames are exempt from the DROP action.", inferred: true}
      ACTn: *actunk

  LAG_GROUP:
    block: lag
    title: Link aggregation group
    desc: |
      Member ports and member count of one link aggregation group.
    fields:
      PORTS: {desc: "Member ports. Each port has one bit."}
      MEMBER_NUM: {desc: "Number of valid :reg:`LAG_MEMBER` slots of the group."}
  LAG_MEMBER:
    block: lag
    title: Link aggregation member slot
    desc: |
      Port in one of the four member slots of a group. The hash result picks a slot.
    fields:
      PORT: {desc: "Port number in this slot."}
  LAG_HASH:
    block: lag
    title: Link aggregation hash inputs
    desc: |
      Frame fields that feed the hash which spreads traffic over the members of a group.
    fields:
      L4_SPORT: {desc: "Include the layer 4 source port."}
      L4_DPORT: {desc: "Include the layer 4 destination port."}
      IP_PROTO: {desc: "Include the IP protocol number."}
      IP_SRC: {desc: "Include the IP source address."}
      IP_DST: {desc: "Include the IP destination address."}
      MAC_SA: {desc: "Include the source MAC address."}
      MAC_DA: {desc: "Include the destination MAC address."}
      SRC_PORT: {desc: "Include the receiving port."}

  ACL_PERMIT_UNMATCH:
    block: acl
    title: ACL unmatched frame permit
    desc: |
      Ports on which a frame that matches no ACL rule is forwarded.
    fields:
      PORTS: {desc: ":lx:`yt921x_chip_setup_acl` sets the bit of every port. It is :ev:`inferred` from the register name that port ``port`` then forwards received frames that match no rule."}
  ACL_PORT:
    block: acl
    title: ACL port enable
    desc: |
      Ports whose received frames are checked against the access control list.
    fields:
      PORTS: {desc: "The access control list is applied to port ``port``."}
  ACL_BLK_CMD:
    block: acl
    title: ACL block command
    desc: |
      Opens one ACL block for modification and commits it; see
      :ref:`Writing a rule <acl-write>`.
    fields:
      BLKID: {desc: "Block number from 0 to 47."}
      MODIFY: {desc: "Write 1 to open the block for writing. Write 0 to commit the changes."}
  ACL_BLK_KEEP:
    block: acl
    title: ACL block keep mask
    desc: |
      While a block is open, marks the key slots that the commit must leave unchanged.
    fields:
      GRPIDn: {desc: "Group number for slot ``bin`` during the commit.", inferred: true}
      KEEPn: {desc: "Slot ``bin`` keeps its current key and mask."}
  ACL_ENTRY:
    block: acl
    title: ACL block slot enables
    desc: |
      Enables the eight key slots of one block and groups slots into rules. Slots with the
      same group number must all match for the rule to hit; the group number is also the slot
      whose :reg:`ACL_ACT` entry holds the action.
    fields:
      GRPIDm: {desc: "Group number of slot ``bin``. The slots of one rule share a group number."}
      ENm: {desc: "Slot ``bin`` is in use."}
  ACL_KEY:
    block: acl
    words: 2
    title: ACL key slot
    desc: |
      Value half of one key slot. Index ``blk`` is the block and ``bin`` the slot in the
      block. The layout of bits 35 to 0 and of the range flags depends on
      :field:`ACL_KEY.TYPE`.
    fields: &aclfields
      ORD: {desc: "Order of the rule. When several rules match, the highest value wins."}
      SPORTS: {desc: "Receiving ports the rule applies to. Each port has one bit."}
      REVERSE: {desc: "The slot matches when the frame does not match the key."}
      TYPE: {desc: "Key type. It selects the layout of the rest of the slot.", enum: acl_type}
      L2_TYPE: {desc: "Frame encapsulation.", enum: l2_type}
      L3_TYPE: {desc: "Layer 3 protocol class.", enum: l3_type}
      L4_TYPE: {desc: "Layer 4 protocol class.", enum: l4_type}
      L4/TYPE: {desc: "Layer 4 protocol class.", enum: l4_type}
      MAC_xA0: {desc: "MAC address bytes 0 to 3. Byte 0 is in bits 31 to 24."}
      MAC_DA1: {desc: "Destination MAC address bytes 4 and 5."}
      MAC_SA1: {desc: "Source MAC address bytes 4 and 5."}
      SVID_RANGE_EN: {desc: "Match the service VLAN ID as a range. It is :ev:`inferred` from the two layer 4 port range flags, which :lx:`yt921x_acl_rule_ext_parse_flow_entries` uses, that the key holds the lowest and the mask the highest value."}
      CVID_RANGE_EN: {desc: "Match the customer VLAN ID as a range. It is :ev:`inferred` from the two layer 4 port range flags, which :lx:`yt921x_acl_rule_ext_parse_flow_entries` uses, that the key holds the lowest and the mask the highest value."}
      CDEI: {desc: "Drop eligible bit of the customer tag."}
      CPRI: {desc: "Priority of the customer tag."}
      CTAG_FMT: {desc: "Customer tag format of the frame. The :ref:`Linux driver <sources-list>` gives no codes. The :ref:`vendor SDK <sources-list>` list `yt_vlan_format_t <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_vlan_translate.h#L40>`__ gives 0 for untagged, 1 for priority-tagged and 2 for tagged.", inferred: true}
      SDEI: {desc: "Drop eligible bit of the service tag."}
      SPRI: {desc: "Priority of the service tag."}
      STAG_FMT: {desc: "Service tag format of the frame. The :ref:`Linux driver <sources-list>` gives no codes. The :ref:`vendor SDK <sources-list>` list `yt_vlan_format_t <https://github.com/OpenEmbeddedBSP/motorcomm-yt9215-switch-sdk/blob/d2c8d6fc721fdb7e04e815b4fe2a397a2817ee5e/switch_sdk/include/yt_vlan_translate.h#L40>`__ gives 0 for untagged, 1 for priority-tagged and 2 for tagged.", inferred: true}
      SVID: {desc: "Service VLAN ID."}
      CVID: {desc: "Customer VLAN ID."}
      ADDR_RANGE_EN: {desc: "Match the address as a range. It is :ev:`inferred` from the two layer 4 port range flags, which :lx:`yt921x_acl_rule_ext_parse_flow_entries` uses, that the key holds the lowest and the mask the highest value."}
      FRAG: {desc: "The packet is an IP fragment."}
      ADDR: {desc: "IPv4 address. The first byte is in bits 31 to 24."}
      ADDRx: {desc: "32 bits of the IPv6 address. The most significant byte is in bits 31 to 24."}
      IP_OPTION: {desc: "The packet has IP options or extension headers."}
      FIRST_FRAG: {desc: "The packet is the first fragment."}
      PPPOE_FLAG: {desc: "The frame carries PPPoE."}
      TCP_FLAGS: {desc: "TCP flags byte."}
      IP_PROTO: {desc: "IP protocol number."}
      TOS: {desc: "IPv4 type of service or IPv6 traffic class byte."}
      DPORT_RANGE_EN: {desc: "Match the destination port as a range. The key holds the lowest and the mask the highest value."}
      SPORT_RANGE_EN: {desc: "Match the source port as a range. The key holds the lowest and the mask the highest value."}
      DPORT: {desc: "Layer 4 destination port."}
      SPORT: {desc: "Layer 4 source port."}
      IS_IGMP: {desc: "The frame is an IGMP message."}
      UDF0: {desc: "Two bytes from the even-numbered user-defined field window of the pair."}
      UDF1: {desc: "Two bytes from the odd-numbered user-defined field window of the pair."}
      ETHERTYPE_RANGE_EN: {desc: "Match the EtherType as a range. It is :ev:`inferred` from the two layer 4 port range flags, which :lx:`yt921x_acl_rule_ext_parse_flow_entries` uses, that the key holds the lowest and the mask the highest value."}
      ETHERTYPE: {desc: "EtherType."}
  ACL_MASK:
    block: acl
    words: 2
    title: ACL mask slot
    desc: |
      Mask half of one key slot. A set bit means the same bit of :reg:`ACL_KEY` must match;
      the layouts are those of the key. For a field matched as a range the mask holds the
      highest value.
    fields: *aclfields
  ACL_ACT:
    block: acl
    words: 3
    title: ACL action entry
    desc: |
      96-bit action of one rule. The entry index is 8 × ``blk`` + the group number of the rule in :field:`ACL_ENTRY.GRPID`.
      Write the three words in rising address order.
    fields:
      STAG:
        desc: "Service tag handling on transmit."
        inferred: true
        values: &tagact {DONTCARE: "Leave to the normal VLAN rules", UNTAG: "Send without the tag", TAG: "Send with the tag", KEEP: "Send as received"}
      CTAG:
        desc: "Customer tag handling on transmit."
        inferred: true
        values: *tagact
      FWD:
        desc: "Forwarding action. It is used when FWD_EN is set."
        values: {FWD: "Forward normally", COPY: "Forward and also send to FWD_REDIR_DPORTS", REDIR: "Send only to FWD_REDIR_DPORTS", TRAP: "Send only to the CPU"}
      FWD_REDIR_DPORTS: {desc: "Destination ports for COPY and REDIR. Each port has one bit. REDIR with no port set drops the frame."}
      FWD_EN: {desc: "Enables the forwarding action."}
      SDEI: {desc: "New drop eligible bit of the service tag."}
      SDEI_REPLACE: {desc: "Replace the drop eligible bit of the service tag."}
      SPRI: {desc: "New priority of the service tag."}
      SPRI_REPLACE: {desc: "Replace the priority of the service tag."}
      SVID: {desc: "New service VLAN ID. The field crosses the boundary between words 1 and 2."}
      SVID_REPLACE: {desc: "Replace the service VLAN ID."}
      CDEI: {desc: "New drop eligible bit of the customer tag."}
      CDEI_REPLACE: {desc: "Replace the drop eligible bit of the customer tag."}
      CPRI: {desc: "New priority of the customer tag."}
      CPRI_REPLACE: {desc: "Replace the priority of the customer tag."}
      CVID: {desc: "New customer VLAN ID."}
      CVID_REPLACE: {desc: "Replace the customer VLAN ID."}
      PRIO: {desc: "Internal priority given to the frame. It is :ev:`inferred` that it is a source for :reg:`PORT_PRIO_ORD`."}
      PRIO_EN: {desc: "Enables PRIO."}
      COLOR:
        desc: "Colour given to the frame."
        inferred: true
        values: {GREEN: "Green", YELLOW: "Yellow", RED: "Red"}
      COLOR_EN: {desc: "Enables COLOR.", inferred: true}
      DSCP: {desc: "New IP DSCP value.", inferred: true}
      DSCP_REPLACE: {desc: "Replace the IP DSCP value.", inferred: true}
      METER_ID: {desc: "Meter that rate limits matching frames. It is an index of :reg:`METER_CTRL`."}
      METER_EN: {desc: "Enables METER_ID."}
      MIRROR_EN: {desc: "Copy matching frames to the monitor port in :field:`MIRROR.PORT`.", inferred: true}
      FLOWSTAT_EN: {desc: "Count matching frames in the flow counter FLOWSTAT_ID.", inferred: true}
      FLOWSTAT_ID: {desc: "Flow counter number.", inferred: true}
      GPIO_EN: {desc: "Signal a match on the pin in GPIO_PIN.", inferred: true}
      GPIO_PIN: {desc: "Pin number.", inferred: true}
      INTR_EN: {desc: "Raise an interrupt on a match.", inferred: true}
  UDF_CTRL:
    block: acl
    title: User-defined field window
    desc: |
      Position of one two-byte window that ACL keys of type UDF can match. Key type UDFk
      matches windows 2k and 2k + 1.
    fields:
      UDF_TYPE: {desc: "Header the offset is counted from.", enum: udf_type}
      UDF_OFFSET: {desc: "Offset in bytes of the two-byte window from the start of that header."}

  PORT_RATE:
    block: meter
    title: Port rate accounting
    desc: |
      Per-frame overhead that rate limiting adds to the frame length.
    inferred: true
    fields:
      GAP_VALUE: {desc: "Bytes added per frame for preamble and inter-frame gap. A meter adds them when :field:`METER_CTRL.BYTE_MODE_INCLUDE_GAP` is set.", reset: 20, unit: bytes, inferred: true}
  METER_SLOT:
    block: meter
    title: Meter time slot
    desc: |
      Period at which every meter adds tokens to its buckets.
    fields:
      SLOT: {desc: "Slot length in units of eight core clock periods. :reg:`SYS_CLK` shows the core clock. The smallest allowed value is 80."}
  PORT_METER:
    block: meter
    title: Port ingress meter
    desc: |
      Attaches one of the per-port meters to the receive side of a port.
    fields:
      EN: {desc: "Enables ingress rate limiting on the port."}
      ID: {desc: "Port meter number n. The meter is entry 64 + n of :reg:`METER_CTRL`."}
  METER_CTRL:
    block: meter
    words: 3
    title: Meter configuration
    desc: |
      96-bit configuration of one two-rate token bucket meter. Entries 0 to 63 are
      general-purpose meters for ACL rules; entries 64 to 74 are the per-port meters.
      :ref:`Token arithmetic <rate-tokens>` gives the conversion from bit rates.
    fields:
      METER_EN: {desc: "Enables the meter."}
      TOKEN_OVERFLOW_EN: {desc: "Tokens that overflow the committed bucket spill into the excess bucket. This meaning is :ev:`inferred` from a comment. The :lx:`comment on the field <tc.h:280>` reads \"RFC4115: yellow use unused green bw\"."}
      DROP:
        desc: "Colours that are dropped."
        values: {GYR: "Drop every frame", YR: "Drop yellow and red frames", R: "Drop red frames", NONE: "Drop nothing and only colour the frame"}
      COLOR_BLIND: {desc: "Ignore the colour the frame already has.", inferred: true}
      UNIT: {desc: "Token scale. Every token value is multiplied by 4 to the power of UNIT."}
      BYTE_MODE_INCLUDE_GAP: {desc: "Add :field:`PORT_RATE.GAP_VALUE` bytes to each frame in byte mode.", inferred: true}
      PKT_MODE: {desc: "Meter packets. Value 0 meters bytes."}
      RFC2698: {desc: "Select the algorithm of `RFC 2698 <https://www.rfc-editor.org/rfc/rfc2698>`__. Value 0 selects that of `RFC 4115 <https://www.rfc-editor.org/rfc/rfc4115>`__.", inferred: true}
      CBS: {desc: "Committed burst size in tokens. The field crosses the boundary between words 1 and 2."}
      CIR: {desc: "Committed information rate in tokens per time slot."}
      EBS: {desc: "Excess burst size in tokens. The field crosses the boundary between words 0 and 1."}
      EIR: {desc: "Excess information rate in tokens per time slot."}
  METER_STAT:
    block: meter
    words: 2
    access: ro
    title: Meter token state
    desc: |
      Current token counts of one meter. The bit layout is :ev:`not known`.
    inferred: true
    add_fields:
      VALUE: {lsb: 0, width: 64, desc: "Layout :ev:`not known`.", inferred: true}

  PORT_SHAPE_SLOT:
    block: shape
    title: Shaper time slot
    desc: |
      Period at which every port shaper adds tokens to its bucket.
    fields:
      SLOT: {desc: "Slot length in units of eight core clock periods. :reg:`SYS_CLK` shows the core clock. The smallest allowed value is 80."}
  PORT_SHAPE_CTRL:
    block: shape
    words: 2
    title: Port egress shaper
    desc: |
      64-bit configuration of the single token bucket that limits what one port sends.
      :ref:`Token arithmetic <rate-tokens>` gives the conversion from bit rates.
    fields:
      EN: {desc: "Enables the shaper."}
      PKT_MODE: {desc: "Shape packets. Value 0 shapes bytes."}
      UNIT: {desc: "Token scale. Every token value is multiplied by 4 to the power of UNIT."}
      CBS: {desc: "Burst size in tokens."}
      CIR: {desc: "Rate in tokens per time slot."}
  PORT_SHAPE_STAT:
    block: shape
    access: ro
    title: Port shaper token state
    desc: |
      Current token count of one port shaper. The bit layout is :ev:`not known`.
    inferred: true
    add_fields:
      VALUE: {lsb: 0, width: 32, desc: "Layout :ev:`not known`.", inferred: true}

  MIRROR:
    block: mirror
    title: Port mirroring
    desc: |
      Source ports and the single monitor port of port mirroring.
    fields:
      IGR_PORTS: {desc: "Ports whose received frames are copied to the monitor port. Each port has one bit."}
      EGR_PORTS: {desc: "Ports whose sent frames are copied to the monitor port. Each port has one bit."}
      PORT: {desc: "Monitor port number."}

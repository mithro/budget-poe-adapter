blocks:
- id: system
  title: Global control
  guide: bringup
  summary: Reset, feature enables, part identification, pin strap overrides, I/O voltage, the temperature
    sensor and the configuration byte store.
- id: cpu
  title: CPU port and frame tagging
  guide: cpu-tag
  summary: Which port leads to the host CPU, whether frames on it carry the 8-byte CPU tag, and where
    trapped frames are sent.
- id: port
  title: Port MAC and external interfaces
  guide: ports
  summary: Per-port speed, duplex, flow control and MAC enables, frame size, and the SGMII and xMII interfaces
    of ports 8 and 9.
- id: mbus
  title: MDIO master buses
  guide: phy
  summary: Two MDIO masters inside the switch, one for the built-in PHYs and SerDes PCS and one for PHYs
    on the external MDIO pins.
- id: eee
  title: Energy Efficient Ethernet
  guide: ports
  summary: Per-port Energy Efficient Ethernet (EEE) enables.
- id: mib
  title: Port counters
  guide: mib
  summary: Per-port packet and byte counters (MIB) and their control register.
- id: led
  title: LEDs
  guide: leds
  summary: What each port LED shows, forced LED states, blink timing, and the serial and parallel LED
    output mapping.
- id: vlan
  title: VLAN
  guide: vlan
  summary: The 4096-entry VLAN table, port default VLANs, tag protocol identifiers, and ingress and egress
    VLAN filtering.
- id: qos
  title: Priority mapping
  guide: qos
  summary: Mapping of DSCP and VLAN priority to the internal priority and colour, and per-port priority
    sources.
- id: l2
  title: Port forwarding control
  guide: forwarding
  summary: Which ports may forward to which, per-port spanning tree state, address learning control and
    the ageing timer.
- id: fdb
  title: Forwarding database
  guide: fdb
  summary: The command interface to the 4096-entry MAC address table.
- id: flood
  title: Flooding and unknown destinations
  guide: forwarding
  summary: Where broadcast, multicast and unknown-destination frames may be flooded, and what happens
    to frames with an unknown destination.
- id: lag
  title: Link aggregation
  guide: lag
  summary: Two link aggregation groups of up to four ports and the hash that spreads traffic over them.
- id: acl
  title: Access control list
  guide: acl
  summary: The 384-entry match and action table, its 48 blocks of eight key slots, and the user-defined
    field windows.
- id: meter
  title: Meters and ingress rate limiting
  guide: rate
  summary: Token bucket meters used for per-port ingress rate limiting and by ACL rules.
- id: shape
  title: Egress shaping
  guide: rate
  summary: Per-port egress token bucket shapers.
- id: mirror
  title: Port mirroring
  guide: mirror
  summary: Copying frames received or sent on chosen ports to one monitor port.

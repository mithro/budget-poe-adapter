registers:
- id: RST
  address: 0x80000
  dims: []
  linux:
    macro: YT921X_RST
    src:
    - chip.h
    - 22
    used: true
    use: [chip.c, yt921x_chip_reset, 2240]
  fields:
  - name: HW
    linux:
      macro: YT921X_RST_HW
      src:
      - chip.h
      - 23
      used: true
      use: [chip.c, yt921x_chip_reset, 2240]
    lsb: 31
    width: 1
    desc: Write 1 to reset the whole chip. The bit clears itself when the reset is complete. Section 4.1.2.1
      of the |ds| calls the bit CHIP_RESET.
    access: rw
    sdk:
      status: not in SDK
  - name: SW
    linux:
      macro: YT921X_RST_SW
      src:
      - chip.h
      - 24
      used: false
    lsb: 1
    width: 1
    desc: Write 1 for a software reset. Section 4.1.2.2 of the |ds| calls the bit SW_RESET. It states
      that the bit clears itself and resets what :field:`RST.HW` resets except the analog circuit of the
      built-in PHYs. No function of the Linux driver uses the bit.
    access: rw
    sdk:
      status: same bits
      fields: [CHIP_SW_RST]
  block: system
  title: Reset control
  desc: 'Starts a reset of the switch. Write :field:`RST.HW` and poll the register until it reads 0;

    :ref:`Reset <bringup-reset>` gives the full sequence.'
